query GetPortfoliosByContact($contactId: Long!) {
  contact(id: $contactId) {
    id
    name
    portfolios {
      id
      name
      currency {
        securityCode
      }
      status
      startDate
    }
  }
}

query GetPortfoliosByParameters($parameters: PortfolioParametersInput) {
  portfoliosByParameters(parameters: $parameters) {
    id
    name
    currency {
      securityCode
    }
    status
    startDate
  }
}
